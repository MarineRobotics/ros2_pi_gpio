# PCF8574 GPIO Configuration
pins:
  - pin: 0
    type: "in"
    description: "Joystick Left Button"

  - pin: 1
    type: "in"
    description: "Joystick Select Button"

  - pin: 2
    type: "in"
    description: "Joystick Down Button"

  - pin: 3
    type: "in"
    description: "Joystick Up Button"

  - pin: 4
    type: "in"
    description: "Joystick Right Button"
